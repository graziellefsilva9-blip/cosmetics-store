<div class="cadastro-container">

    <h2>Cadastro de Cliente</h2>
    <p>Preencha seus dados para realizar seu cadastro.</p>
  
    <form (ngSubmit)="salvar()" #formCliente="ngForm">
  
      <div class="campo">
        <label>Nome completo</label>
        <input
          type="text"
          name="nome"
          [(ngModel)]="pessoa.nome"
          required
          placeholder="Digite seu nome">
      </div>
  
      <div class="campo">
        <label>CPF</label>
        <input
          type="number"
          name="cpf"
          [(ngModel)]="pessoa.cpf"
          required
          placeholder="Digite seu CPF">
      </div>
  
      <div class="campo">
        <label>Data de nascimento</label>
        <input
          type="date"
          name="dataNascimento"
          [(ngModel)]="pessoa.dataNascimento"
          required>
      </div>
  
      <div class="campo">
        <label>Sexo</label>
        <select
          name="sexo"
          [(ngModel)]="pessoa.sexo"
          required>
          <option value="">Selecione</option>
          <option value="F">Feminino</option>
          <option value="M">Masculino</option>
        </select>
      </div>
  
      <div class="campo">
        <label>E-mail</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="pessoa.email"
          required
          placeholder="Digite seu e-mail">
      </div>
  
      <div class="campo">
        <label>Telefone</label>
        <input
          type="number"
          name="telefone"
          [(ngModel)]="pessoa.telefone"
          required
          placeholder="Digite seu telefone">
      </div>
  
      <h3>Endereço</h3>
  
      <div class="campo">
        <label>CEP</label>
        <input
          type="text"
          name="cep"
          [(ngModel)]="pessoa.enderecos[0].cep"
          required
          placeholder="Digite seu CEP">
      </div>
  
      <div class="campo">
        <label>Número</label>
        <input
          type="text"
          name="numero"
          [(ngModel)]="pessoa.enderecos[0].numero"
          required
          placeholder="Número do endereço">
      </div>
  
      <div class="campo">
        <label>Complemento</label>
        <input
          type="text"
          name="complemento"
          [(ngModel)]="pessoa.enderecos[0].complemento"
          placeholder="Apartamento, casa etc.">
      </div>
  
      <div class="mensagem sucesso" *ngIf="mensagem">
        {{ mensagem }}
      </div>
  
      <div class="mensagem erro" *ngIf="erro">
        {{ erro }}
      </div>
  
      <div class="botoes">
        <button type="submit" [disabled]="formCliente.invalid">
          Salvar cadastro
        </button>
  
        <button type="button" (click)="limpar()">
          Limpar
        </button>
      </div>
  
    </form>
  
  </div>
